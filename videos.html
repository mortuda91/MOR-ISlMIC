<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الفيديوهات التعليمية</title>

  <style>
    body {
      font-family: "Cairo", sans-serif;
      background-color: #f6f8fb;
      margin: 0;
      padding: 20px;
      text-align: center;
      direction: rtl;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      justify-items: center;
    }

    .video-card {
      background: #fff;
      padding: 10px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
      width: 100%;
      max-width: 420px;
    }

    .video-card:hover {
      transform: scale(1.03);
    }

    iframe {
      width: 100%;
      height: 230px;
      border-radius: 10px;
    }

    .video-title {
      margin-top: 10px;
      font-weight: bold;
      color: #34495e;
      font-size: 1.1em;
    }

    footer {
      margin-top: 40px;
      color: #7f8c8d;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <h1>📚 مكتبة الفيديوهات التعليمية</h1>

  <div class="video-grid">

    <!-- 🔹 الفيديو الأول -->
    <div class="video-card">
      <iframe width="727" height="409" src="https://www.youtube.com/embed/dQw4w9WgXcQ"
title="تجربة تشغيل الفيديو" frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen></iframe>

      <div class="video-title">تحفيظ بتكرار سورة الملك (من الآية 1 إلى الآية 6)</div>
    </div>

    <!-- 🔹 هنا يمكنك إضافة المزيد من الفيديوهات -->
    <!-- انسخ الكود التالي وعدّله -->
    <!--
    <div class="video-card">
      <iframe src="https://www.youtube.com/embed/رابط_الفيديو" title="اسم الفيديو"></iframe>
      <div class="video-title">عنوان الفيديو</div>
    </div>
    -->

  </div>

  <footer>
    جميع الحقوق محفوظة © منصة التربية الإسلامية - مدرسة المبدأ الابتدائية المختلطة
  </footer>

</body>
</html>
